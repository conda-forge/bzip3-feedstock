context:
  version: "1.5.5"

package:
  name: bzip3
  version: ${{ version }}

source:
  url: https://github.com/kspalaiologos/bzip3/archive/${{ version }}.tar.gz
  sha256: d61c05785bccb50d4af75107556d9fc7373995f873270b729184509e9f1be6dd

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  run_exports:
    - ${{ pin_subpackage('bzip3') }}

tests:
  - script:
      - bzip3 --help

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: A better and stronger spiritual successor to BZip2.
  homepage: https://github.com/kspalaiologos/bzip3
  repository: https://github.com/kspalaiologos/bzip3

extra:
  recipe-maintainers:
    - danielnachun
