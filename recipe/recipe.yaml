context:
  version: "1.5.4"

package:
  name: bzip3
  version: ${{ version }}

source:
  url: https://github.com/kspalaiologos/bzip3/archive/${{ version }}.tar.gz
  sha256: c4ff6bfe4a8a9fed987a9de4d6a6f4025a991acec9559fae4853a9d99ca8d76a

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  run_exports:
    - ${{ pin_subpackage('bzip3') }}

tests:
  - script:
      - bzip3 --help

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: A better and stronger spiritual successor to BZip2.
  homepage: https://github.com/kspalaiologos/bzip3
  repository: https://github.com/kspalaiologos/bzip3

extra:
  recipe-maintainers:
    - danielnachun
